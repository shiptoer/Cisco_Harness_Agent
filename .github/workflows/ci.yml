name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Bộ đầy đủ (kể cả test `slow`), chạy song song bằng pytest-xdist. Cùng tập test với `pytest`.
      - run: pytest -n auto
