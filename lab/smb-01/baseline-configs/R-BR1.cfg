! ================================================================
! R-BR1  - Router chi nhanh (IOL L3)
! Lab smb-01 - BAN CHOT (12/10/2026)
! BAN REPO: secret la placeholder, thay khi nap len lab
! ================================================================
hostname R-BR1
!
service password-encryption
service timestamps log datetime msec
no service config
no ip domain-lookup
ip domain-name smb.lab
no ip http server
no ip http secure-server
!
enable secret {{ENABLE_SECRET}}
username netadmin privilege 15 secret {{ADMIN_PASSWORD}}
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
aaa new-model
tacacs server TAC1
 address ipv4 10.10.50.10
 key {{TACACS_KEY}}
 timeout 2
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
aaa authorization exec default group tacacs+ local
!
interface Ethernet0/0
 duplex full
 description WAN-R-EDGE1-e0/2
 ip address 10.255.0.6 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 duplex full
 description UPLINK-ACC-BR1-e0/0
 ip address 10.255.0.9 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 duplex full
 description UNUSED
 no ip address
 shutdown
!
interface Ethernet0/3
 duplex full
 description OOB-MGMT
 no cdp enable
 vrf forwarding MGMT
 ip address 192.168.137.12 255.255.255.0
 no shutdown
!
ip route 10.20.0.0 255.255.0.0 10.255.0.10 name BRANCH-LAN
ip route 0.0.0.0 0.0.0.0 10.255.0.5 name DEFAULT-HQ
!
ip access-list standard ACL-MGMT-VTY
 permit host 192.168.137.1
 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 deny   any log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner login #
Thiet bi thuoc lab smb-01. Chi nguoi duoc uy quyen moi duoc truy cap.
#
!
line con 0
 login authentication CONSOLE
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL-MGMT-VTY in vrf-also
 exec-timeout 10 0
 transport input ssh
!
crypto key generate rsa general-keys modulus 2048
!
end
