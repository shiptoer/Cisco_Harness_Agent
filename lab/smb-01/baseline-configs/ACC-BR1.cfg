! ================================================================
! ACC-BR1  - Switch L3 chi nhanh, lam gateway cho LAN chi nhanh (IOL L2, 2 portgroup)
! Lab smb-01 - BAN CHOT (12/10/2026)
! BAN REPO: secret la placeholder, thay khi nap len lab
! ================================================================
hostname ACC-BR1
!
service password-encryption
service timestamps log datetime msec
no service config
no ip domain-lookup
ip domain-name smb.lab
no ip http server
no ip http secure-server
ip routing
!
enable secret {{ENABLE_SECRET}}
username netadmin privilege 15 secret {{ADMIN_PASSWORD}}
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
aaa new-model
tacacs server TAC1
 address ipv4 10.10.50.10
 key {{TACACS_KEY}}
 timeout 2
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
aaa authorization exec default group tacacs+ local
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
vlan 110
 name BR-STAFF
vlan 199
 name BR-MGMT
vlan 999
 name NATIVE-UNUSED
!
interface Ethernet0/0
 description UPLINK-R-BR1-e0/1
 no switchport
 ip address 10.255.0.10 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description PC-BR-STAFF-01
 switchport mode access
 switchport access vlan 110
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface Ethernet0/2
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet0/3
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/0
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/1
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/2
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/3
 description OOB-MGMT
 no switchport
 no cdp enable
 vrf forwarding MGMT
 ip address 192.168.137.34 255.255.255.0
 no shutdown
!
interface Vlan110
 description GW-BR-STAFF
 ip address 10.20.10.1 255.255.255.0
 no shutdown
!
interface Vlan199
 description GW-BR-MGMT
 ip address 10.20.99.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.255.0.9 name DEFAULT-BR
!
ip access-list standard ACL-MGMT-VTY
 permit host 192.168.137.1
 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 deny   any log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner login #
Thiet bi thuoc lab smb-01. Chi nguoi duoc uy quyen moi duoc truy cap.
#
!
line con 0
 login authentication CONSOLE
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL-MGMT-VTY in vrf-also
 exec-timeout 10 0
 transport input ssh
!
crypto key generate rsa general-keys modulus 2048
!
end
