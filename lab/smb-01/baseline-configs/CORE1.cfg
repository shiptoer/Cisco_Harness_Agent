! ================================================================
! CORE1  - Switch L3 loi tru so (IOL L2)
! Lab smb-01 - BAN CHOT (12/10/2026)
! BAN REPO: secret la placeholder, thay khi nap len lab
! ================================================================
hostname CORE1
!
service password-encryption
service timestamps log datetime msec
no service config
no ip domain-lookup
ip domain-name smb.lab
no ip http server
no ip http secure-server
ip routing
!
enable secret {{ENABLE_SECRET}}
username netadmin privilege 15 secret {{ADMIN_PASSWORD}}
!
vrf definition MGMT
 address-family ipv4
 exit-address-family
!
aaa new-model
tacacs server TAC1
 address ipv4 10.10.50.10
 key {{TACACS_KEY}}
 timeout 2
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
aaa authorization exec default group tacacs+ local
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
! ---------- VLAN ----------
vlan 10
 name STAFF
vlan 20
 name SALES
vlan 30
 name FINANCE
vlan 40
 name HR
vlan 50
 name SERVERS
vlan 60
 name GUEST
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
! ---------- Interface ----------
interface Ethernet0/0
 description UPLINK-R-EDGE1-e0/0
 no switchport
 ip address 10.255.0.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TRUNK-ACC1-e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,60,99
 switchport nonegotiate
 no shutdown
!
interface Ethernet0/2
 description TRUNK-ACC2-e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,40,99
 switchport nonegotiate
 no shutdown
!
interface Ethernet0/3
 description TRUNK-ACC3-e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 50,99
 switchport nonegotiate
 no shutdown
!
interface Ethernet1/0
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/1
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/2
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Ethernet1/3
 description OOB-MGMT
 no switchport
 no cdp enable
 vrf forwarding MGMT
 ip address 192.168.137.21 255.255.255.0
 no shutdown
!
! ---------- SVI (gateway cac VLAN) ----------
interface Vlan10
 description GW-STAFF
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description GW-SALES
 ip address 10.10.20.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description GW-FINANCE
 ip address 10.10.30.1 255.255.255.0
 no shutdown
!
interface Vlan40
 description GW-HR
 ip address 10.10.40.1 255.255.255.0
 no shutdown
!
interface Vlan50
 description GW-SERVERS
 ip address 10.10.50.1 255.255.255.0
 ip access-group ACL-SERVERS-OUT out
 no shutdown
!
interface Vlan60
 description GW-GUEST
 ip address 10.10.60.1 255.255.255.0
 ip access-group ACL-GUEST-IN in
 no shutdown
!
interface Vlan99
 description GW-INBAND-MGMT
 ip address 10.10.99.1 255.255.255.0
 no shutdown
!
! ---------- Static route ----------
ip route 0.0.0.0 0.0.0.0 10.255.0.1 name DEFAULT-EDGE
!
! ---------- ACL ----------
ip access-list extended ACL-GUEST-IN
 remark Khach chi ra Internet, khong vao mang noi bo
 deny   ip 10.10.60.0 0.0.0.255 10.0.0.0 0.255.255.255
 permit ip 10.10.60.0 0.0.0.255 any
 deny   ip any any log
!
ip access-list extended ACL-SERVERS-OUT
 remark May chu tai chinh chi cho VLAN FINANCE qua HTTPS
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.50.20 eq 443
 deny   ip any host 10.10.50.20 log
 permit ip any any
!
ip access-list standard ACL-MGMT-VTY
 permit host 192.168.137.1
 permit 10.10.99.0 0.0.0.255
 permit 10.20.99.0 0.0.0.255
 deny   any log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner login #
Thiet bi thuoc lab smb-01. Chi nguoi duoc uy quyen moi duoc truy cap.
#
!
line con 0
 login authentication CONSOLE
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL-MGMT-VTY in vrf-also
 exec-timeout 10 0
 transport input ssh
!
crypto key generate rsa general-keys modulus 2048
!
end
