! ================================================================
! ISP  - Mo phong Internet (IOL L3). KHONG thuoc pham vi harness quan ly,
! KHONG noi vao MGMT. Khong co NAT (ngoai scope): ISP route nguoc ve 10.0.0.0/8.
! ================================================================
hostname ISP
!
no service config
no ip domain-lookup
no ip http server
no ip http secure-server
!
enable secret {{ENABLE_SECRET}}
username netadmin privilege 15 secret {{ADMIN_PASSWORD}}
!
interface Ethernet0/0
 duplex full
 description CUSTOMER-SMB-R-EDGE1
 no cdp enable
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description FAKE-INTERNET-HOST
 ip address 198.51.100.1 255.255.255.255
!
ip route 10.0.0.0 255.0.0.0 203.0.113.1 name SMB-CUSTOMER
!
line con 0
 login local
 exec-timeout 15 0
 logging synchronous
!
end
